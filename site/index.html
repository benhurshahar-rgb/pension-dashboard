<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>החיסכון הפנסיוני של שחר ולוטם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1446;--muted:#4C4677;--bg:#F3F0FF;--hero:#241A5C;--line:#F1EEFB;--green:#047857;--red:#B91C1C}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif}
a{color:#4338CA}a:hover{color:#312E81}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 72px;display:flex;flex-direction:column;gap:28px}
.card{background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:34px;font-weight:800}
h2{margin:0;font-size:22px;font-weight:800}
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:22px}
.hero .sub{font-size:15px;color:#D4CCFF}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.kpi{border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:14px;font-weight:600}.kpi .v{font-size:32px;font-weight:800}.kpi .s{font-size:13px;font-weight:600}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:0 0 14px}
.sq{width:12px;height:12px;border-radius:4px;display:inline-block;flex:0 0 12px}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:20px}
.donut{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.donut svg{width:250px;height:250px;flex:0 0 250px}
.legend{flex:1 1 220px;max-width:560px;min-width:0;display:flex;flex-direction:column;gap:4px}
.legend button{display:flex;align-items:center;gap:8px;font:inherit;font-size:14px;color:var(--ink);border:0;border-radius:10px;padding:8px 10px;min-height:44px;text-align:right;cursor:pointer;background:transparent}
.legend button.on{background:var(--line)}
.legend .side{font-weight:700;display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.sidel{font-size:11px;font-weight:600;color:var(--muted)}
.info{position:relative;display:inline-flex}
.qbtn{width:26px;height:26px;border-radius:50%;border:2px solid #C4B5FD;background:#fff;color:#4338CA;font:inherit;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.qbtn:hover,.qbtn[aria-expanded=true]{background:#4338CA;color:#fff;border-color:#4338CA}
.pop{position:absolute;top:32px;right:-8px;z-index:20;width:min(380px,86vw);background:#fff;color:var(--ink);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(26,20,70,.18);font-size:14px;line-height:1.55;font-weight:400}
.pop b{display:block;margin-top:6px}.pop b:first-child{display:inline;margin:0}
.pop .pg{color:#047857}.pop .pr{color:#B91C1C}
.pop ul{margin:2px 0 0;padding-inline-start:18px}
.legend .lab{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.legend .det{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.chip{font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
.tablebox{overflow-x:auto;background:#fff;border-radius:20px}
.t{min-width:1220px}
.tr.ft{grid-template-columns:1.7fr 0.9fr 1.6fr 0.9fr 0.9fr 1.3fr 1.3fr 1fr}
.tr{display:grid;grid-template-columns:0.7fr 2fr 1.4fr 1fr 1fr 1fr 1.2fr 0.9fr 1fr 1.2fr;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center;font-size:15px}
.th{font-size:13px;font-weight:700}
.cell{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.small{font-size:12px;color:var(--muted)}
.pill{font-weight:700;font-size:14px;padding:2px 8px;border-radius:6px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(150px,300px) 1fr 90px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:22px;background:#F7F5FE;border-radius:6px;overflow:hidden}
.bar .fill{height:22px;border-radius:6px}
.sep{display:flex;align-items:center;gap:16px;margin-top:12px}
.sep div{flex:1 1 auto;height:3px;border-radius:2px;background:var(--hero)}
.sep span{font-size:15px;font-weight:800;color:var(--hero);letter-spacing:1px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login form{background:#fff;border-radius:24px;padding:32px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
#login input[type=password]{font:inherit;font-size:17px;padding:12px 14px;border:2px solid #DDD6FE;border-radius:12px;min-height:48px}
#login button{font:inherit;font-size:17px;font-weight:700;background:var(--hero);color:#fff;border:0;border-radius:12px;min-height:48px;cursor:pointer}
#login label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
#err{color:var(--red);font-weight:600;font-size:14px;min-height:20px;margin:0}
footer{font-size:13px;color:var(--muted);border-top:1px solid #DDD6FE;padding-top:14px;display:flex;flex-direction:column;gap:4px}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:#4338CA;cursor:pointer;padding:0;text-decoration:underline}
@media (max-width:600px){h1{font-size:26px}.kpi .v{font-size:26px}.donut svg{width:220px;height:220px;flex-basis:220px}}
.btn-sm{font:inherit;font-size:13px;font-weight:600;background:#EEF2FF;color:#312E81;border:0;border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer}
.btn-sm:hover{background:#E0E7FF}
.banner{background:#FFF7ED;border:2px solid #FDBA74;border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.banner ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.banner li{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px}
dialog{border:0;border-radius:24px;padding:0;width:min(520px,94vw);color:var(--ink);font-family:inherit}
dialog::backdrop{background:rgba(26,20,70,.45)}
dialog form{padding:26px;display:flex;flex-direction:column;gap:12px}
dialog label{font-weight:600;font-size:14px}
dialog input[type=number],dialog input[type=date]{font:inherit;font-size:16px;padding:10px 12px;border:2px solid #DDD6FE;border-radius:10px;min-height:44px;width:100%}
dialog .actions{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
dialog .primary{font:inherit;font-size:16px;font-weight:700;background:var(--hero);color:#fff;border:0;border-radius:12px;min-height:46px;padding:0 20px;cursor:pointer}
dialog .ghost{font:inherit;font-size:16px;background:#F1EEFB;color:var(--ink);border:0;border-radius:12px;min-height:46px;padding:0 20px;cursor:pointer}
#upPrev{max-width:100%;max-height:180px;border-radius:10px;display:block}
.drop{border:2px dashed #C4B5FD;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#FAF8FF}
h3{margin:0;font-size:19px;font-weight:800}
.cgroup{display:flex;flex-direction:column;gap:10px}
.owner{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;background:#F1EEFB;border-radius:12px;padding:4px;gap:4px}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:9px;padding:0 14px;min-height:38px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--hero);color:#fff}
.custom{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.custom input{font:inherit;font-size:14px;padding:6px 8px;border:2px solid #DDD6FE;border-radius:8px;min-height:38px}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gstats>div{background:#F7F5FE;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.gstats b{font-size:18px}
.gl{font-size:12px;color:var(--muted);font-weight:600}
.gwrap{direction:ltr;display:grid;grid-template-columns:1fr 64px;grid-template-rows:300px 26px;column-gap:8px}
.gplot{position:relative;grid-column:1;grid-row:1;cursor:crosshair;touch-action:pan-y}
.yaxis{position:relative;grid-column:2;grid-row:1;font-size:12px;color:var(--muted)}
.yaxis span{position:absolute;left:4px;transform:translateY(-50%);white-space:nowrap}
.xaxis{position:relative;grid-column:1;grid-row:2;font-size:12px;color:var(--muted)}
.xaxis span{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap}
.xaxis span:first-child{transform:none}.xaxis span:last-child{transform:translateX(-100%)}
.gcursor{position:absolute;top:0;bottom:0;width:1px;background:#1A1446;opacity:.35;pointer-events:none}
.gdot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid;transform:translate(-50%,-50%);pointer-events:none}
.gtip{direction:rtl;position:absolute;top:6px;transform:translateX(-50%);background:#1A1446;color:#fff;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(26,20,70,.25)}
.gtip span[style*="color"]{filter:brightness(1.8)}
.sortbtn{font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:#fff;border:1px solid #DDD6FE;border-radius:8px;padding:4px 8px;cursor:pointer;justify-self:start}
.mini{height:6px;background:#F1EEFB;border-radius:3px;overflow:hidden;width:100%}
.mini div{height:6px;border-radius:3px}
.hist{background:#FAF8FF;border-bottom:1px solid var(--line);padding:12px 20px 16px;display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:110px 130px 1fr 220px 110px 130px;gap:12px;align-items:center;font-size:14px}
.hh{font-size:12px;font-weight:700;color:var(--muted)}
.covgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cov{background:#FAF8FF;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.covrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed #E5E0F8;padding-bottom:4px}
</style>
</head>
<body>
<div id="login">
  <form id="lf">
    <h1 style="font-size:26px">הדשבורד המשפחתי</h1>
    <p class="note">הנתונים מוצפנים. הכנס סיסמה כדי לפתוח.</p>
    <label for="pw" style="font-weight:600">סיסמה</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="ck"><input id="rem" type="checkbox" checked> לזכור במכשיר הזה</label>
    <button type="submit" id="go">פתח</button>
    <p id="err" role="alert"></p>
  </form>
</div>
<main id="app" class="wrap" hidden></main>
<dialog id="upd">
  <form method="dialog" id="updForm">
    <h2 id="updTitle" style="font-size:20px">עדכון יתרה</h2>
    <p class="note" id="updSub"></p>
    <div class="drop">
      <label for="updFile">צרף צילום מסך מאתר הקופה</label>
      <input id="updFile" type="file" accept="image/*">
      <span class="small" id="updOcr">התמונה נקראת אצלך בדפדפן בלבד ולא נשמרת בשום מקום. המספר יזוהה וימולא אוטומטית.</span>
      <img id="updPrev" alt="" hidden>
    </div>
    <label for="updBal" id="updBalLab">יתרה</label>
    <input id="updBal" type="number" step="0.01" min="0" required>
    <label for="updDate">נכון לתאריך</label>
    <input id="updDate" type="date" required>
    <label for="updUnits">מספר יחידות (לא חובה)</label>
    <input id="updUnits" type="number" step="0.001" min="0">
    <p class="note">בלחיצה על "שמור" ייפתח GitHub עם קובץ מוצפן מוכן. לוחצים שם <b>Commit changes</b> – והאתר מתעדכן תוך כ־2 דקות.</p>
    <div class="actions"><button class="primary" id="updGo" value="go">שמור</button><button class="ghost" value="cancel" formnovalidate>ביטול</button></div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
const STORE = 'pension-dashboard-key';

async function deriveKey(pw, enc) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub64(enc.salt), iterations: enc.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt', 'encrypt']);
}
async function decrypt(key, enc) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(enc.iv) }, key, ub64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadEnc() {
  const r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
  return r.json();
}

let ENC = null, KEY = null, DATA = null;
(async () => {
  try { ENC = await loadEnc(); } catch { $('#err').textContent = 'לא הצלחתי לטעון את הנתונים.'; return; }
  if (ENC.empty) { $('#err').textContent = 'האתר מוכן – ממתין לנתונים הראשונים.'; return; }
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.salt === ENC.salt) {
      const key = await crypto.subtle.importKey('raw', ub64(saved.k), 'AES-GCM', false, ['decrypt', 'encrypt']);
      KEY = key; show(await decrypt(key, ENC));
    }
  } catch { try { localStorage.removeItem(STORE); } catch {} }
})();

$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!ENC || ENC.empty) return;
  $('#go').disabled = true; $('#err').textContent = 'פותח…';
  try {
    const key = await deriveKey($('#pw').value, ENC);
    const data = await decrypt(key, ENC);
    if ($('#rem').checked) {
      try { localStorage.setItem(STORE, JSON.stringify({ salt: ENC.salt, k: b64(await crypto.subtle.exportKey('raw', key)) })); } catch {}
    }
    KEY = key; show(data);
  } catch {
    $('#err').textContent = 'סיסמה שגויה.';
  } finally { $('#go').disabled = false; }
});

// ---------- formatting ----------
const ils = (n) => n == null ? '—' : (n < 0 ? '-' : '') + '₪' + Math.round(Math.abs(n)).toLocaleString('en-US');
const sIls = (n) => n == null ? '' : (n >= 0 ? '+' : '-') + '₪' + Math.round(Math.abs(n)).toLocaleString('en-US');
const nat = (n, c) => ({ ILS: '₪', USD: '$', EUR: '€' }[c] || '') + Math.round(n).toLocaleString('en-US');
const pct = (n, d = 2) => n == null ? '—' : (n >= 0 ? '▲ ' : '▼ ') + Math.abs(n).toFixed(d) + '%';
const col = (n) => n == null ? '#4C4677' : n >= 0 ? '#047857' : '#B91C1C';
const bg = (n) => n == null ? '#F1EEFB' : n >= 0 ? '#D1FAE5' : '#FEE2E2';
const m2 = (n) => '₪' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
const dt = (s) => { const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };
const mon = (s) => { const [y, m] = s.split('-'); return `${m}/${y}`; };

const HEB_M = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const monY = (s) => { const [y, m] = s.split('-'); return `${HEB_M[+m - 1]} ${y}`; };
const pensionKpi = (P, bgc, fg) => P.depositsPaused
  ? `<div class="kpi" style="background:${bgc};color:${fg}"><span class="l">קצבה צפויה – ${esc(P.name)} (בלי הפקדות כרגע)</span><span class="v">${ils(P.pensionWithout)}<span style="font-size:15px;font-weight:600"> / חודש</span></span><span class="s">אם ${P.resumeNote ? esc(P.resumeNote) + ' ו' : ''}ההפקדות יחזרו כמו קודם: ${ils(P.pensionWith)}</span></div>`
  : `<div class="kpi" style="background:${bgc};color:${fg}"><span class="l">קצבה צפויה – ${esc(P.name)}</span><span class="v">${ils(P.pensionWith)}<span style="font-size:15px;font-weight:600"> / חודש</span></span><span class="s">ללא המשך הפקדות: ${ils(P.pensionWithout)}</span></div>`;
const daysSince = (s) => Math.floor((Date.now() - new Date(s + 'T12:00:00Z')) / 86400000);
const agoTxt = (s) => { const d = daysSince(s); return d <= 0 ? 'היום' : d === 1 ? 'אתמול' : d < 60 ? `לפני ${d} ימים` : `לפני ${Math.round(d / 30)} חודשים`; };
const isStale = (f) => !f.reported ? true : daysSince(f.reported.date) > (f.cur === 'ILS' ? 120 : 90);
const REPO = (() => { const o = location.hostname.split('.')[0], r = location.pathname.split('/').filter(Boolean)[0]; return location.hostname.endsWith('github.io') && r ? `${o}/${r}` : 'benhurshahar-rgb/pension-dashboard'; })();

// ---------- balance update (encrypted with the page key, committed via GitHub's web editor) ----------
let UPD = null;
function openUpdate(id) {
  const f = DATA.people.flatMap((p) => p.funds.map((x) => ({ ...x, person: p.name }))).find((x) => x.id === id);
  if (!f) return;
  UPD = f;
  const sym = { ILS: '₪', USD: '$', EUR: '€' }[f.cur];
  $('#updTitle').textContent = `עדכון יתרה – ${f.person} · ${f.kind} ${f.provider}`;
  $('#updSub').textContent = f.reported ? `יתרה אחרונה: ${nat(f.reported.amount, f.reported.cur)} נכון ל־${dt(f.reported.date)}` : 'אין עדיין יתרה מדווחת לקופה הזו.';
  $('#updBalLab').textContent = `יתרה (${sym})`;
  $('#updBal').value = ''; $('#updUnits').value = '';
  $('#updDate').value = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Jerusalem' });
  $('#updFile').value = ''; $('#updPrev').hidden = true;
  $('#updOcr').textContent = 'התמונה נקראת אצלך בדפדפן בלבד ולא נשמרת בשום מקום. המספר יזוהה וימולא אוטומטית.';
  $('#upd').showModal();
}
function loadTesseract() {
  return window.Tesseract ? Promise.resolve(window.Tesseract) : new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = () => res(window.Tesseract); sc.onerror = rej; document.head.appendChild(sc);
  });
}
function pickAmount(text, cur) {
  const sym = { ILS: '₪', USD: '\\$', EUR: '€' }[cur];
  const re = new RegExp(`(?:${sym})\\s?(\\d{1,3}(?:,\\d{3})+(?:\\.\\d{1,2})?)`, 'g');
  const counts = new Map();
  for (const m of text.matchAll(re)) { const v = parseFloat(m[1].replace(/,/g, '')); counts.set(v, (counts.get(v) || 0) + 1); }
  if (!counts.size) for (const m of text.matchAll(/(\d{1,3}(?:,\d{3})+\.\d{2})/g)) { const v = parseFloat(m[1].replace(/,/g, '')); counts.set(v, (counts.get(v) || 0) + 1); }
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || b[0] - a[0])[0]?.[0] ?? null;
}
$('#updFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  $('#updPrev').src = url; $('#updPrev').hidden = false;
  $('#updOcr').textContent = 'קורא את המספרים מהתמונה…';
  try {
    const T = await loadTesseract();
    const { data } = await T.recognize(file, 'eng');
    const v = pickAmount(data.text, UPD.cur);
    const units = (data.text.match(/UNIT[^\d]{0,40}([\d,]+\.\d+)/i) || [])[1];

const C = 2 * Math.PI * 76;

// ---------- donut ----------
// Center shows a fixed total; hovering only highlights. Each slice ≥ 4% gets its share printed inside it.
function donutHtml(id, aria, items, center) {
  const sum = items.reduce((a, it) => a + it.v, 0);
  let cum = 0;
  const circles = [], labels = [];
  items.forEach((it, i) => {
    const len = it.v / sum * C, d = Math.max(len - 2, 0.5);
    circles.push(`<circle data-i="${i}" cx="100" cy="100" r="76" fill="none" stroke="${it.color}" stroke-width="26" stroke-dasharray="${d.toFixed(2)} ${(C - d).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}" style="cursor:pointer;transition:stroke-width .15s,opacity .15s"></circle>`);
    const share = it.v / sum;
    if (share >= 0.04) {
      const ang = (-90 + (cum + len / 2) / C * 360) * Math.PI / 180;
      labels.push(`<text pointer-events="none" x="${(100 + 76 * Math.cos(ang)).toFixed(1)}" y="${(100 + 76 * Math.sin(ang) + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px">${Math.round(share * 100)}%</text>`);
    }
    cum += len;
  });
  const legend = items.map((it, i) => `<button type="button" data-i="${i}"><span class="sq" style="background:${it.color}"></span><span class="lab"><span style="font-weight:600">${esc(it.label)}</span>${it.detail ? `<span class="det">${esc(it.detail)}</span>` : ''}</span><span class="side" style="color:${it.sideColor || '#1A1446'}">${it.side}</span></button>`).join('');
  return `<div class="donut" id="${id}">
    <svg viewBox="0 0 200 200" role="img" aria-label="${esc(aria)}">
      <circle cx="100" cy="100" r="76" fill="none" stroke="#F1EEFB" stroke-width="26"></circle>
      <g transform="rotate(-90 100 100)">${circles.join('')}</g>
      ${labels.join('')}
      <text class="c1" pointer-events="none" x="100" y="82" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4C4677"></text>
      <text class="c2" pointer-events="none" x="100" y="106" text-anchor="middle" font-size="20" font-weight="800" fill="#1A1446"></text>
      <text class="c3" pointer-events="none" x="100" y="125" text-anchor="middle" font-size="11.5" font-weight="700"></text>
      <text class="c4" pointer-events="none" x="100" y="140" text-anchor="middle" font-size="10" fill="#4C4677"></text>
    </svg>
    <div class="legend">${legend}</div></div>`;
}
// center: { idle(sum) → lines when nothing is hovered, hover(item, sum) → lines for one slice }
function wireDonut(id, items, center) {
  const root = document.getElementById(id);
  const sum = items.reduce((a, it) => a + it.v, 0);
  const set = (i) => {
    const c = i == null ? center.idle(sum) : center.hover(items[i], sum);
    root.querySelector('.c1').textContent = c.l1 || '';
    root.querySelector('.c2').textContent = c.l2 || '';
    const t3 = root.querySelector('.c3'); t3.textContent = c.l3 || ''; t3.setAttribute('fill', c.l3c || '#4C4677');
    root.querySelector('.c4').textContent = c.l4 || '';
    root.querySelectorAll('circle[data-i]').forEach((el) => {
      const on = i == null || +el.dataset.i === i;
      el.setAttribute('stroke-width', i != null && on ? 34 : 26); el.style.opacity = on ? 1 : 0.35;
    });
    root.querySelectorAll('.legend button').forEach((b) => b.classList.toggle('on', +b.dataset.i === i));
  };
  root.querySelectorAll('[data-i]').forEach((el) => {
    const i = +el.dataset.i;
    el.addEventListener('mouseenter', () => set(i)); el.addEventListener('mouseleave', () => set(null));
    el.addEventListener('focus', () => set(i)); el.addEventListener('blur', () => set(null));
    el.addEventListener('click', () => set(i));
  });
  set(null);
}

// ---------- growth chart ----------
function niceTicks(min, max, count) {
  const raw = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), err = raw / mag;
  const step = mag * (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1);
  const out = []; for (let v = Math.ceil(min / step) * step; v <= max; v += step) out.push(v);
  return out;
}
function renderGrowth() {

  const to = UI.range === 'custom' && UI.to ? UI.to : last;
  if (from < first) from = first;
  const idx = dates.map((d, i) => (d >= from && d <= to ? i : -1)).filter((i) => i >= 0);
  const series = (i) => UI.gWho === 's' ? P('s').values[i] : UI.gWho === 'l' ? P('l').values[i] : P('s').values[i] + P('l').values[i];

  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.12 || hi * 0.02; lo -= pad; hi += pad;
  const ticks = niceTicks(lo, hi, 4);

      <div><span class="gl">הכי גבוה</span><b>${ils(vals[imax])}</b><span class="gl">${dt(ds[imax])}</span></div>

// ---------- fees vs market ----------
function renderFees() {
  const B = DATA.benchmarks;
  const fdir = UI.feeSort === 'desc' ? -1 : 1;
  const rows = DATA.fees.rows.filter((r) => UI.feeWho === 'all' || r.person === UI.feeWho).sort((a, b) => fdir * (a.cost - b.cost));
  const maxCost = Math.max(1, ...rows.map((r) => r.cost));
  const status = (r) => {
    if (r.acc == null) return ['אין נתון', '#F1EEFB', '#4C4677'];
    const accHigh = r.accAvg != null && r.acc > r.accAvg * 1.1 + 0.01;
    const depHigh = r.active && r.dep != null && r.depAvg != null && r.dep > r.depAvg + 0.05;
    return accHigh || depHigh ? ['מעל הממוצע – שווה מו״מ', '#FFEDD5', '#9A3412'] : ['בממוצע או מתחת', '#D1FAE5', '#065F46'];
  };
  const totCost = rows.reduce((a, r) => a + r.cost, 0), totSave = rows.reduce((a, r) => a + r.saving, 0);
  $('#feesBody').innerHTML = `
    <div class="gstats">
      <div><span class="gl">סה״כ דמי ניהול לשנה</span><b>${ils(totCost)}</b></div>
      <div style="background:${totSave > 0 ? '#FFEDD5' : '#D1FAE5'};color:${totSave > 0 ? '#9A3412' : '#065F46'}"><span class="gl" style="color:inherit">אפשר לחסוך בשנה אם יורידו לממוצע</span><b>${ils(totSave)}</b></div>
    </div>
    <div class="tablebox"><div class="t" style="min-width:1140px">
      <div class="tr th ft"><span>קופה</span><span>מהצבירה – שלכם</span><span>מהצבירה – ממוצע בשוק</span><span>מההפקדה – שלכם</span><span>מההפקדה – ממוצע בשוק</span><button type="button" class="sortbtn" id="feeSort" aria-label="מיון לפי עלות לשנה">עלות לשנה ${UI.feeSort === 'desc' ? '↓' : '↑'}</button><span>מצב</span><span>חיסכון אפשרי לשנה</span></div>
      ${rows.map((r) => { const [st, sb, sc] = status(r); return `
      <div class="tr ft">
        <div class="cell"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${ownerPill(r.person, r.personName)}<b>${esc(r.kind)}</b></div><span class="small">${esc(r.provider)}</span></div>
        <span style="font-weight:700">${r.acc == null ? '?' : (r.accApprox ? '≈' : '') + r.acc.toFixed(2) + '%'}</span>
        <div class="cell"><span>${r.accAvg == null ? '—' : r.accAvg.toFixed(2) + '%'}</span><span class="small">${esc(B[r.category] ? B[r.category].label : '')}</span></div>
        <span style="font-weight:700">${r.active && r.dep != null ? r.dep.toFixed(2) + '%' : '<span class="small" style="font-weight:400">אין הפקדות</span>'}</span>
        <span>${r.depAvg != null ? r.depAvg.toFixed(2) + '%' : '—'}</span>
        <div class="cell" style="width:100%"><b>${ils(r.cost)}</b><div class="mini"><div style="width:${(r.cost / maxCost * 100).toFixed(1)}%;background:${ACCENT[r.person]}"></div></div></div>
        <span class="tag" style="background:${sb};color:${sc};align-self:center;justify-self:start">${st}</span>
        <span style="font-weight:700;color:${r.saving > 0 ? '#9A3412' : '#4C4677'}">${r.saving > 0 ? ils(r.saving) : '—'}</span>
      </div>`; }).join('')}
    </div></div>
    <div class="note" style="display:flex;flex-direction:column;gap:4px">
      <span>"עלות לשנה" = דמי ניהול מהצבירה × השווי היום, ועוד דמי ניהול מההפקדה × ההפקדות בשנה (רק בקופות פעילות). "חיסכון אפשרי" = כמה הייתם חוסכים בשנה אם דמי הניהול היו יורדים לממוצע.</span>
      <span>${esc(B.pension.tip)}</span>
      <span>מקורות לממוצעים: ${Object.values(B).filter((b) => b.src).map((b) => b.srcUrl ? `<a href="${esc(b.srcUrl)}" target="_blank" rel="noopener">${esc(b.src)}</a>` : esc(b.src)).filter((v, i, a) => a.indexOf(v) === i).join(' · ')}</span>
    </div>`;
  $('#feeSort').addEventListener('click', () => { UI.feeSort = UI.feeSort === 'desc' ? 'asc' : 'desc'; renderFees(); });
}

  $('#gApply').addEventListener('click', () => { UI.from = $('#gFrom').value; UI.to = $('#gTo').value; if (UI.from > UI.to) [UI.from, UI.to] = [UI.to, UI.from]; renderGrowth(); });
  const realF = D.people.flatMap((p) => p.funds.filter((f) => f.realSince).map((f) => `${p.name} – ${f.kind} ${f.provider.split(' – ')[0]} (מ־${f.realSince.slice(0, 4)})`));
  $('#growthNote').textContent = (realF.length ? `נתוני אמת מהדוחות השנתיים (כולל הפקדות): ${realF.join(' · ')}. ` : '') + 'בשאר הקופות, ובתקופה שלפני הדוח הראשון, הגרף הוא הערכה: השווי של היום לפי תנועות השוק במסלול של כל קופה, בלי הפקדות. ככל שתעלו עוד דוחות שנתיים – הגרף יהיה מדויק יותר.';
  renderGrowth(); renderCompare(); renderFees();
  $('#logout').addEventListener('click', () => { try { localStorage.removeItem(STORE); } catch {} location.reload(); });
}
</script>
</body>
</html>
